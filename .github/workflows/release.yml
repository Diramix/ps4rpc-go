name: Release

on:
  release:
    types: [published]

jobs:
  generate-notes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog with git-cliff
        uses: orhun/git-cliff-action@v4
        id: cliff
        with:
          config: .github/cliff.toml
          args: --latest --tag-pattern "v?[0-9]+\.[0-9]+.*" --strip all

      - name: Set release notes
        if: steps.cliff.outputs.content != ''
        uses: actions/github-script@v7
        env:
          CLIFF_OUTPUT: ${{ steps.cliff.outputs.content }}
        with:
          script: |
            const release = context.payload.release;

            if (release.body && release.body.trim().length > 0) {
              console.log('Release already has a body, skipping.');
              return;
            }

            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              body: process.env.CLIFF_OUTPUT,
            });

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build distribution archives
        run: task dist

      - name: Upload artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
